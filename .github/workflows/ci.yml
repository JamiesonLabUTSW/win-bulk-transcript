name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore WinBulkTranscript.sln --locked-mode
      - name: Build
        run: dotnet build WinBulkTranscript.sln --configuration Release --no-restore
      - name: Run deterministic Core tests
        run: dotnet test tests/WinBulkTranscript.Core.Tests/WinBulkTranscript.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      # Foundry model downloads, Windows TTS corpus generation, real media fixtures, and
      # architecture-specific published-artifact checks are intentionally opt-in release gates.
