name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate-tag:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse and validate tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $pattern = '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?)$'
          $tagMatch = [regex]::Match($env:RELEASE_TAG, $pattern)
          if (-not $tagMatch.Success) {
            throw "Release tag '$env:RELEASE_TAG' must be canonical SemVer prefixed by v, for example v1.2.3 or v1.2.3-rc.1."
          }

          $version = $tagMatch.Groups['version'].Value
          $majorVersion = [int]($version.Split('.')[0])
          $isPrerelease = $majorVersion -eq 0 -or $version.Contains('-')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Require the tagged commit on the default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit reachable from origin/$env:DEFAULT_BRANCH."
          }

  build:
    name: Build win-${{ matrix.architecture }}
    needs: validate-tag
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify release scripts
        shell: pwsh
        run: |
          ./scripts/Test-Publish-ReleaseHardening.ps1
          ./scripts/Test-ReleaseMechanics.ps1
          ./scripts/Test-ReleaseArtifactVerifier.ps1

      - name: Restore locked dependencies
        run: dotnet restore WinBulkTranscript.sln --locked-mode

      - name: Build
        run: dotnet build WinBulkTranscript.sln --configuration Release --no-restore

      - name: Run deterministic Core tests
        run: dotnet test tests/WinBulkTranscript.Core.Tests/WinBulkTranscript.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build release artifact from committed evidence
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $artifactsRoot = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          ./scripts/Invoke-TagRelease.ps1 `
            -Tag $env:RELEASE_TAG `
            -Architecture $env:RELEASE_ARCHITECTURE `
            -ArtifactsRoot $artifactsRoot

      - name: Stage immutable release files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $artifactName = "WinBulkTranscript-$env:RELEASE_VERSION-win-$env:RELEASE_ARCHITECTURE"
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'release-staging'
          [IO.Directory]::CreateDirectory($stagingRoot) | Out-Null

          foreach ($suffix in @('.zip', '.zip.sha256', '.release-record.json')) {
            $sourcePath = Join-Path $sourceRoot ($artifactName + $suffix)
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Expected release file was not created: $sourcePath"
            }

            [IO.File]::Copy($sourcePath, (Join-Path $stagingRoot ([IO.Path]::GetFileName($sourcePath))), $false)
          }

      - name: Upload architecture release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-${{ matrix.architecture }}
          path: ${{ runner.temp }}/release-staging/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish reviewed draft
    needs: [validate-tag, build]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download architecture release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-win-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify assembled release and create combined checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          $repositoryRevision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $repositoryRevision -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'Could not resolve the checked-out release commit.'
          }

          ./scripts/Test-ReleaseArtifacts.ps1 `
            -ArtifactsRoot (Join-Path $env:RUNNER_TEMP 'release-assets') `
            -Version $env:RELEASE_VERSION `
            -RepositoryRevision $repositoryRevision `
            -ChecksumManifestPath (Join-Path $env:RUNNER_TEMP 'release-assets\SHA256SUMS.txt')

      - name: Attest release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          $releaseOptions = @(
            '--verify-tag',
            '--draft',
            '--title', "WinBulkTranscript $env:RELEASE_TAG",
            '--notes-file', (Join-Path $env:GITHUB_WORKSPACE "release-inputs\$env:RELEASE_TAG\release-notes.md")
          )
          if ($env:IS_PRERELEASE -eq 'true') {
            $releaseOptions += '--prerelease'
          }

          gh release create $env:RELEASE_TAG (Join-Path $env:RUNNER_TEMP 'release-assets\*') @releaseOptions
